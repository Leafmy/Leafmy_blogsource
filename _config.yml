# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 受命于天，既寿永昌
subtitle: '分享技巧与经验'
description: '一个关于技术、编程和生活的个人博客'
keywords:
- 月抛
- 男男
- 百合
- 猎奇
author: l3AFovxs
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://leafmy.top
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
# 关闭原生高亮, 改用 hexo-shiki-plugin-butterfly (Shiki 高亮, 内置 github-light/dark)
# Hexo 7.0+ 需将 syntax_highlighter 置空, 避免与 Shiki 冲突
syntax_highlighter: ''
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: true
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

 # --- Hexo Shiki Plugin (hexo-shiki-plugin-butterfly) 配置 ---
shiki:
  # 用 css-variables 主题让 Shiki 输出 var(--shiki-token-*) 变量,
  # 再由 code-highlight.css 按 data-theme 明/暗分别填 GitHub Light / GitHub Dark 色值。
  # 这样同一份代码块 html 能随主题切换: 浅色=github-light 白卡, 深色=github-dark 黑卡。
  theme: css-variables
  line_number: true          # 显示行号
  beautify: true             # 启用代码块工具条(复制/语言/折叠), 依赖 font-awesome (Butterfly 已内置)
  colorized_brackets: true   # 嵌套括号着色 (@shikijs/colorized-brackets)
  highlight_copy: true       # 显示复制按钮
  highlight_lang: true       # 显示代码语言
  highlight_height_limit: 360 # 代码块最大高度(px), 超出显示折叠按钮
  is_highlight_shrink: false # false=默认展开
  # 本地化 CSS/JS, 避免依赖 jsdelivr CDN (博客可离线/自托管)
  css_cdn: /custom/effects/shiki-codeblock.css
  js_cdn: /custom/effects/shiki-codeblock.js
  skip_languages:            # 不应由 shiki 高亮的语言(交由 Butterfly 处理)
    - mermaid
  copy:                      # 复制提示文案
    success: '复制成功'
    error: '复制失败'
    no_support: '浏览器不支持'

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hexo-theme-butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: 
  repo: 
  branch: 
  message: 
